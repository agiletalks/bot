<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KB-03 | 易用性測試（Usability Testing）與質化訪談實戰教學手冊 | 安全存取驗證</title>
    <style>
        :root {
            --primary: #8b151b;
            --primary-dark: #680d12;
            --primary-light: #fbebee;
            --secondary: #1e293b;
            --text-main: #334155;
            --text-muted: #64748b;
            --bg-body: #0f172a;
            --card-bg: #ffffff;
            --accent-gold: #c59b27;
            --accent-gold-light: #fdfaf0;
            --border: #e2e8f0;
            --radius: 12px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b2e 50%, #1a0d13 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .auth-container {
            width: 100%;
            max-width: 480px;
        }
        .brand-header {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #ffffff;
        }
        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(197, 155, 39, 0.15);
            border: 1px solid var(--accent-gold);
            color: #f1d58a;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 0.75rem;
            letter-spacing: 0.5px;
        }
        .brand-header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 0.35rem;
        }
        .brand-header p {
            font-size: 0.9rem;
            color: #94a3b8;
        }
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            border-top: 5px solid var(--primary);
        }
        .card-body {
            padding: 2rem;
        }
        .shield-icon {
            width: 52px;
            height: 52px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            margin: 0 auto 1.25rem;
        }
        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            text-align: center;
            color: var(--secondary);
            margin-bottom: 0.5rem;
        }
        .card-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.5;
            margin-bottom: 1.75rem;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-label {
            display: block;
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--secondary);
            margin-bottom: 0.4rem;
        }
        .form-label span {
            font-weight: 400;
            color: var(--text-muted);
            font-size: 0.8rem;
        }
        .input-wrap {
            position: relative;
        }
        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            color: var(--secondary);
            background: #f8fafc;
            transition: all 0.2s ease;
        }
        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(139, 21, 27, 0.15);
        }
        .toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.85rem;
            padding: 4px;
        }
        .remember-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
        }
        .remember-wrap input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
        }
        .submit-btn {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(139, 21, 27, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .submit-btn:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }
        .submit-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .alert-error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1.25rem;
            display: none;
            line-height: 1.4;
        }
        .status-spinner {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 1rem;
        }
        .spinner-ring {
            width: 18px;
            height: 18px;
            border: 2px solid #cbd5e1;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .auth-footer {
            margin-top: 1.75rem;
            text-align: center;
            font-size: 0.78rem;
            color: #64748b;
            line-height: 1.5;
        }
        #splash-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            color: #ffffff;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div id="splash-screen">
        <div class="spinner-ring" style="width: 36px; height: 36px; border-width: 3px; border-top-color: #c59b27;"></div>
        <div>正在檢查安全授權狀態...</div>
    </div>

    <div class="auth-container" id="auth-panel" style="display: none;">
        <div class="brand-header">
            <div class="brand-badge">🏛️ 臺灣銀行 數位外匯敏捷專案</div>
            <h1>內部知識庫系統</h1>
            <p>16 週輔導精華 • 敏捷心法 • 金融研究模型</p>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="shield-icon">🔐</div>
                <h2 class="card-title">雙層安全驗證</h2>
                <p class="card-subtitle">本站內容採 AES-256 軍規加密保護。<br>請依序輸入機構驗證碼與專案通行密碼以解鎖存取。</p>

                <div class="alert-error" id="error-msg"></div>

                <form id="auth-form" onsubmit="handleAuth(event)">
                    <div class="form-group">
                        <label class="form-label" for="pass1">
                            第一層：機構統一編號 <span>(8 碼數字)</span>
                        </label>
                        <div class="input-wrap">
                            <input type="text" id="pass1" class="form-input" placeholder="請輸入臺灣銀行 8 碼機構統一編號" autocomplete="username" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="pass2">
                            第二層：專案通行密碼 <span>(外匯敏捷識別碼)</span>
                        </label>
                        <div class="input-wrap">
                            <input type="password" id="pass2" class="form-input" placeholder="請輸入專案通行密碼" autocomplete="current-password" required>
                            <button type="button" class="toggle-btn" onclick="togglePassVisibility()">👁️</button>
                        </div>
                    </div>

                    <label class="remember-wrap">
                        <input type="checkbox" id="remember" checked>
                        <span>在此瀏覽階段保持解鎖（跨篇章免重複輸入）</span>
                    </label>

                    <button type="submit" class="submit-btn" id="submit-btn">
                        <span>驗證並解鎖知識庫</span> ➔
                    </button>

                    <div class="status-spinner" id="loading-spinner">
                        <div class="spinner-ring"></div>
                        <span>正在執行 AES-256 安全解密...</span>
                    </div>
                </form>
            </div>
        </div>

        <div class="auth-footer">
            <p>臺灣銀行 數位外匯服務體驗優化敏捷專案小組 • 專屬知識資產</p>
            <p style="margin-top: 4px; opacity: 0.7;">軍規端對端加密技術 (PBKDF2 100k + AES-GCM 256-bit)</p>
        </div>
    </div>

        async function deriveAesKey(pass1, pass2, saltBytes) {
            const enc = new TextEncoder();
            const combined = pass1.trim() + "::" + pass2.trim();
            const baseKey = await crypto.subtle.importKey(
                'raw',
                enc.encode(combined),
                'PBKDF2',
                false,
                ['deriveKey']
            );
            return await crypto.subtle.deriveKey(
                {
                    name: 'PBKDF2',
                    salt: saltBytes,
                    iterations: 100000,
                    hash: 'SHA-256'
                },
                baseKey,
                { name: 'AES-GCM', length: 256 },
                false,
                ['decrypt']
            );
        }

        async function doDecrypt(pass1, pass2, isAuto = false) {
            const errorEl = document.getElementById('error-msg');
            const submitBtn = document.getElementById('submit-btn');
            const loadingEl = document.getElementById('loading-spinner');
            
            if (errorEl) errorEl.style.display = 'none';
            if (loadingEl) loadingEl.style.display = 'flex';
            if (submitBtn) submitBtn.disabled = true;

            try {
                const saltBytes = Uint8Array.from(atob(PAYLOAD.salt), c => c.charCodeAt(0));
                const ivBytes = Uint8Array.from(atob(PAYLOAD.iv), c => c.charCodeAt(0));
                const cipherBytes = Uint8Array.from(atob(PAYLOAD.data), c => c.charCodeAt(0));

                const key = await deriveAesKey(pass1, pass2, saltBytes);
                const plainBuffer = await crypto.subtle.decrypt(
                    { name: 'AES-GCM', iv: ivBytes },
                    key,
                    cipherBytes
                );

                const dec = new TextDecoder();
                const decryptedHtml = dec.decode(plainBuffer);

                // Save session for cross-page seamless browsing
                const rememberEl = document.getElementById('remember');
                const remember = rememberEl ? rememberEl.checked : true;
                if (remember) {
                    sessionStorage.setItem('bot_kb_auth', JSON.stringify({ p1: pass1.trim(), p2: pass2.trim() }));
                }

                // Render decrypted content cleanly
                document.open();
                document.write(decryptedHtml);
                document.close();
            } catch (err) {
                console.warn("Authentication or decryption failed:", err);
                if (loadingEl) loadingEl.style.display = 'none';
                if (submitBtn) submitBtn.disabled = false;
                
                if (isAuto) {
                    sessionStorage.removeItem('bot_kb_auth');
                    document.getElementById('splash-screen').style.display = 'none';
                    document.getElementById('auth-panel').style.display = 'block';
                } else {
                    if (errorEl) {
                        errorEl.innerHTML = '<strong>❌ 驗證失敗</strong><br>機構統一編號或專案通行密碼不正確，請重新核對後再試。';
                        errorEl.style.display = 'block';
                    }
                }
            }
        }

        function handleAuth(e) {
            e.preventDefault();
            const p1 = document.getElementById('pass1').value;
            const p2 = document.getElementById('pass2').value;
            doDecrypt(p1, p2, false);
        }

        // Auto-unlock with session credentials if already authenticated
        window.addEventListener('DOMContentLoaded', async () => {
            const saved = sessionStorage.getItem('bot_kb_auth');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (parsed.p1 && parsed.p2) {
                        await doDecrypt(parsed.p1, parsed.p2, true);
                        return;
                    }
                } catch(e) {}
            }
            document.getElementById('splash-screen').style.display = 'none';
            document.getElementById('auth-panel').style.display = 'block';
        });
    </script>
</body>
</html>
